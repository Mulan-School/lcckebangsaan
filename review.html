<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengawas - Cerdas Cermat Kebangsaan 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            merah: '#9b1c1c',
                            merahHover: '#7f1616',
                            gold: '#b8860b'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f5f2; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 antialiased">
    <div id="app"></div>

    <script>
        const SUPABASE_URL = 'https://lhfjydoqphlypsgglklh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Pf4G_sAlH9HBz32NO4Y-7w_8y1yKJfI';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const NOMOR = Array.from({ length: 25 }, (_, i) => i + 1);
        const STATUS = {
            aktif: { teks: 'Aktif', cls: 'bg-blue-100 text-blue-700' },
            terkunci: { teks: 'Terkunci', cls: 'bg-red-100 text-red-700' },
            selesai: { teks: 'Selesai', cls: 'bg-emerald-100 text-emerald-700' }
        };

        let st = {
            masuk: false,
            memuat: false,
            pesanLogin: '',
            pesanAksi: '',
            soal: [],
            peserta: [],
            aktif: null,
            cari: '',
            urut: 'peringkat'
        };

        function esc(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatWaktu(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return isNaN(d) ? iso : d.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        }

        function formatDurasi(detik) {
            if (typeof detik !== 'number') return '-';
            return `${Math.floor(detik / 60)} mnt ${detik % 60} dtk`;
        }

        function kategori(skor) {
            if (skor >= 90) return { teks: 'Sangat baik', cls: 'bg-emerald-100 text-emerald-700' };
            if (skor >= 75) return { teks: 'Baik', cls: 'bg-blue-100 text-blue-700' };
            if (skor >= 60) return { teks: 'Cukup', cls: 'bg-amber-100 text-amber-700' };
            return { teks: 'Perlu bimbingan', cls: 'bg-rose-100 text-rose-700' };
        }

        function petakan(s) {
            const arr = Array.isArray(s.hasil) ? s.hasil : [];
            const h = arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;
            return {
                sesiId: s.id,
                kelas: s.kelas,
                statusSesi: s.status,
                kodeBuka: s.kode_buka,
                pelanggaran: Array.isArray(s.pelanggaran) ? s.pelanggaran : [],
                mulai: s.mulai,
                sudahKumpul: !!h,
                hasilId: h ? h.id : null,
                skor: h ? Number(h.skor) : null,
                benar: h ? h.benar : null,
                salah: h ? h.salah : null,
                kosong: h ? h.kosong : null,
                durasi: h ? formatDurasi(h.durasi_detik) : '',
                kumpul: h ? h.created_at : null,
                jawaban: h ? h.jawaban : {},
                detail: h ? h.detail : {}
            };
        }

        function daftarPeringkat() {
            return st.peserta
                .filter(p => p.sudahKumpul)
                .sort((a, b) => {
                    if (b.skor !== a.skor) return b.skor - a.skor;
                    return new Date(a.kumpul) - new Date(b.kumpul);
                });
        }

        function peringkatMap() {
            const map = {};
            daftarPeringkat().forEach((p, i) => { map[p.sesiId] = i + 1; });
            return map;
        }

        async function login(email, pw) {
            st.memuat = true; st.pesanLogin = ''; render();
            const { error } = await db.auth.signInWithPassword({ email, password: pw });
            st.memuat = false;
            if (error) { st.pesanLogin = 'Email atau kata sandi salah.'; render(); return; }
            await muat();
        }

        async function muat() {
            st.memuat = true; render();
            const [soalRes, sesiRes] = await Promise.all([
                db.from('soal').select('*').order('no'),
                db.from('sesi').select('*, hasil(*)').order('dibuat')
            ]);
            st.memuat = false;

            if (soalRes.error || sesiRes.error) {
                st.pesanLogin = 'Gagal memuat data. Pastikan login sebagai guru.';
                st.masuk = false;
                await db.auth.signOut();
                render();
                return;
            }

            st.soal = soalRes.data;
            st.peserta = sesiRes.data.map(petakan);
            st.masuk = true;
            render();
        }

        async function keluar() {
            await db.auth.signOut();
            st = { ...st, masuk: false, peserta: [], soal: [], aktif: null, pesanAksi: '' };
            render();
        }

        function render() {
            document.getElementById('app').innerHTML = st.masuk ? renderDashboard() : renderLogin();
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 w-full max-w-sm space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-50 text-brand-merah flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-user-lock"></i>
                            </div>
                            <h1 class="text-lg font-bold text-gray-900">Halaman Pengawas</h1>
                            <p class="text-xs text-gray-500">Cerdas Cermat Kebangsaan 2026</p>
                        </div>
                        <form onsubmit="event.preventDefault(); login(this.email.value.trim(), this.pw.value);" class="space-y-4">
                            <input name="email" type="email" required placeholder="Email" class="w-full p-3 border-2 border-gray-200 focus:border-brand-merah rounded-xl text-sm outline-none transition">
                            <input name="pw" type="password" required placeholder="Kata sandi" class="w-full p-3 border-2 border-gray-200 focus:border-brand-merah rounded-xl text-sm outline-none transition">
                            ${st.pesanLogin ? `<p class="text-xs text-red-600">${esc(st.pesanLogin)}</p>` : ''}
                            <button type="submit" ${st.memuat ? 'disabled' : ''} class="w-full py-3 bg-brand-merah hover:bg-brand-merahHover disabled:opacity-60 text-white font-bold rounded-xl transition text-sm">
                                ${st.memuat ? 'Memuat...' : 'Masuk'}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            const selesai = st.peserta.filter(p => p.sudahKumpul);
            const terkunci = st.peserta.filter(p => p.statusSesi === 'terkunci').length;
            const tertinggi = selesai.length ? Math.max(...selesai.map(p => p.skor)) : null;
            const rata = selesai.length ? (selesai.reduce((a, p) => a + p.skor, 0) / selesai.length).toFixed(1) : '-';

            return `
                <div class="bg-brand-merah text-white py-3 px-4 sm:px-6 shadow-md no-print">
                    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
                        <div class="flex items-center space-x-2 min-w-0">
                            <i class="fa-solid fa-flag text-amber-300"></i>
                            <h1 class="text-xs sm:text-sm font-semibold truncate">Pengawas - Cerdas Cermat Kebangsaan 2026</h1>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <button onclick="eksporCSV()" class="bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                                <i class="fa-solid fa-file-csv"></i> Ekspor CSV
                            </button>
                            <button onclick="muat()" class="bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                                <i class="fa-solid fa-rotate"></i>
                            </button>
                            <button onclick="keluar()" class="bg-white text-brand-merah hover:bg-rose-50 px-3 py-1.5 rounded-xl text-xs font-bold transition">
                                Keluar
                            </button>
                        </div>
                    </div>
                </div>

                <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="bg-white rounded-2xl p-4 border border-gray-200">
                            <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Peserta</span>
                            <span class="block text-2xl font-extrabold text-gray-900">${st.peserta.length}</span>
                        </div>
                        <div class="bg-white rounded-2xl p-4 border border-gray-200">
                            <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Sudah Kumpul</span>
                            <span class="block text-2xl font-extrabold text-emerald-600">${selesai.length}</span>
                        </div>
                        <div class="bg-white rounded-2xl p-4 border border-gray-200">
                            <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Terkunci</span>
                            <span class="block text-2xl font-extrabold text-red-600">${terkunci}</span>
                        </div>
                        <div class="bg-white rounded-2xl p-4 border border-gray-200">
                            <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Nilai Tertinggi</span>
                            <span class="block text-2xl font-extrabold text-brand-gold">${tertinggi !== null ? tertinggi : '-'}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        <section class="lg:col-span-7 bg-white rounded-2xl border border-gray-200 overflow-hidden">
                            <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between gap-3">
                                <h2 class="text-sm font-bold text-gray-900"><i class="fa-solid fa-ranking-star text-brand-gold mr-1"></i> Peringkat</h2>
                                <span class="text-[11px] text-gray-500">Nilai sama: yang lebih dulu mengumpulkan di atas</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead>
                                        <tr class="bg-gray-50 text-[11px] uppercase tracking-wider text-gray-500">
                                            <th class="p-3 text-left w-12">#</th>
                                            <th class="p-3 text-left">Kelas</th>
                                            <th class="p-3 text-center">Benar</th>
                                            <th class="p-3 text-center">Nilai</th>
                                            <th class="p-3 text-left">Kategori</th>
                                            <th class="p-3 text-left">Kumpul</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${renderBarisPeringkat()}
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        <section class="lg:col-span-5 space-y-4">
                            <div class="bg-white rounded-2xl border border-gray-200 p-5">
                                <h2 class="text-sm font-bold text-gray-900 mb-3"><i class="fa-solid fa-list-check text-brand-merah mr-1"></i> Status Semua Kelas</h2>
                                <input type="text" value="${esc(st.cari)}" oninput="setCari(this.value)" placeholder="Cari kelas..." class="w-full p-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-merah mb-3">
                                <div id="daftar-kelas" class="space-y-1.5 max-h-[55vh] overflow-y-auto custom-scrollbar pr-1">
                                    ${renderDaftarKelas()}
                                </div>
                            </div>
                        </section>
                    </div>

                    <section id="detail" class="bg-white rounded-2xl border border-gray-200 p-5">
                        ${renderDetail()}
                    </section>
                </div>
            `;
        }

        function renderBarisPeringkat() {
            const list = daftarPeringkat();
            if (!list.length) {
                return `<tr><td colspan="6" class="p-6 text-center text-xs text-gray-500">Belum ada kelas yang mengumpulkan.</td></tr>`;
            }
            return list.map((p, i) => {
                const k = kategori(p.skor);
                const medali = i === 0 ? 'bg-amber-100 text-amber-800' : i === 1 ? 'bg-gray-100 text-gray-700' : i === 2 ? 'bg-orange-100 text-orange-800' : 'bg-gray-50 text-gray-500';
                return `
                    <tr class="border-t border-gray-100 cursor-pointer hover:bg-gray-50" onclick="pilih('${p.sesiId}')">
                        <td class="p-3"><span class="inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-bold ${medali}">${i + 1}</span></td>
                        <td class="p-3 font-semibold text-gray-900">${esc(p.kelas)}</td>
                        <td class="p-3 text-center text-gray-700">${p.benar}/25</td>
                        <td class="p-3 text-center font-extrabold text-brand-merah">${p.skor}</td>
                        <td class="p-3"><span class="text-[10px] font-bold uppercase px-2 py-1 rounded ${k.cls}">${k.teks}</span></td>
                        <td class="p-3 text-xs text-gray-500">${formatWaktu(p.kumpul)}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderDaftarKelas() {
            const map = peringkatMap();
            const list = st.peserta
                .filter(p => !st.cari || p.kelas.toLowerCase().includes(st.cari.toLowerCase()))
                .sort((a, b) => a.kelas.localeCompare(b.kelas));

            if (!list.length) return `<p class="text-xs text-gray-500 text-center py-4">Tidak ada kelas yang cocok.</p>`;

            return list.map(p => {
                const s = STATUS[p.statusSesi] || STATUS.aktif;
                const aktif = st.aktif === p.sesiId;
                return `
                    <button onclick="pilih('${p.sesiId}')" class="w-full text-left p-3 rounded-xl border transition ${aktif ? 'border-brand-merah bg-rose-50/60' : 'border-transparent hover:bg-gray-50'}">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-sm font-semibold text-gray-900 truncate">${esc(p.kelas)}</span>
                            <span class="text-xs font-bold text-brand-merah shrink-0">${p.sudahKumpul ? p.skor : '-'}</span>
                        </div>
                        <div class="flex items-center gap-1.5 mt-1 flex-wrap">
                            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${s.cls}">${s.teks}</span>
                            ${p.sudahKumpul ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-700">Peringkat ${map[p.sesiId]}</span>` : ''}
                            ${p.pelanggaran.length ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-50 text-rose-700">${p.pelanggaran.length} pelanggaran</span>` : ''}
                        </div>
                    </button>
                `;
            }).join('');
        }

        function panelKunci(p) {
            const s = STATUS[p.statusSesi] || STATUS.aktif;
            let tombol = '';
            if (p.statusSesi === 'terkunci') {
                tombol = `
                    <div class="flex flex-wrap gap-2">
                        <button onclick="buatKode('${p.sesiId}')" class="px-4 py-2 bg-brand-merah hover:bg-brand-merahHover text-white text-xs font-bold rounded-xl transition">
                            <i class="fa-solid fa-key"></i> Buat Kode Buka
                        </button>
                        <button onclick="bukaPaksa('${p.sesiId}')" class="px-4 py-2 border border-gray-300 hover:bg-gray-50 text-xs font-bold rounded-xl transition">
                            Buka Paksa
                        </button>
                    </div>
                `;
            } else if (p.statusSesi === 'selesai') {
                tombol = `
                    <button onclick="izinkanUlang('${p.sesiId}')" class="px-4 py-2 border border-gray-300 hover:bg-gray-50 text-xs font-bold rounded-xl transition">
                        <i class="fa-solid fa-rotate-left"></i> Izinkan Ulang
                    </button>
                `;
            }

            return `
                <div class="border border-gray-200 rounded-xl p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Status</span>
                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-lg ${s.cls}">${s.teks}</span>
                    </div>
                    ${p.statusSesi === 'terkunci' && p.kodeBuka ? `
                        <div class="bg-rose-50 border border-rose-100 rounded-xl p-3 text-center">
                            <span class="block text-[11px] text-gray-500">Kode buka (berikan ke kelas)</span>
                            <span class="block text-2xl font-extrabold tracking-widest text-brand-merah">${esc(p.kodeBuka)}</span>
                        </div>
                    ` : ''}
                    ${tombol}
                    ${p.pelanggaran.length ? `
                        <div>
                            <span class="block text-[11px] font-bold text-gray-600 mb-1">Pelanggaran (${p.pelanggaran.length})</span>
                            <ul class="space-y-1 bg-rose-50 border border-rose-100 rounded-xl p-3 text-[11px] text-rose-800">
                                ${p.pelanggaran.map((x, i) => `<li>${i + 1}. ${esc(x.jenis)} (soal ${esc(x.soal)}, ${formatWaktu(x.waktu)})</li>`).join('')}
                            </ul>
                        </div>
                    ` : '<p class="text-[11px] text-gray-500">Tidak ada pelanggaran.</p>'}
                </div>
            `;
        }

        function renderDetail() {
            const p = st.peserta.find(x => x.sesiId === st.aktif);
            if (!p) {
                return `<p class="text-xs text-gray-500 text-center py-6"><i class="fa-solid fa-hand-pointer mr-1"></i> Pilih kelas untuk melihat rincian.</p>`;
            }

            const aksi = st.pesanAksi ? `<div class="p-3 rounded-xl text-xs bg-blue-50 text-blue-800 border border-blue-100">${esc(st.pesanAksi)}</div>` : '';

            if (!p.sudahKumpul) {
                return `
                    <div class="space-y-4">
                        <div>
                            <h2 class="text-base font-bold text-gray-900">${esc(p.kelas)}</h2>
                            <p class="text-xs text-gray-500">Mulai ${formatWaktu(p.mulai)} Ã‚Â· Belum mengumpulkan</p>
                        </div>
                        ${aksi}
                        ${panelKunci(p)}
                    </div>
                `;
            }

            const k = kategori(p.skor);
            return `
                <div class="space-y-5">
                    <div class="flex flex-wrap items-start justify-between gap-4">
                        <div>
                            <h2 class="text-base font-bold text-gray-900">${esc(p.kelas)}</h2>
                            <p class="text-xs text-gray-500">Kumpul ${formatWaktu(p.kumpul)} Ã‚Â· Durasi ${esc(p.durasi)}</p>
                        </div>
                        <div class="text-right">
                            <span class="block text-[11px] text-gray-500 uppercase tracking-wider">Nilai</span>
                            <span class="text-3xl font-extrabold text-brand-merah">${p.skor}</span>
                            <span class="block text-[10px] font-bold uppercase px-2 py-0.5 rounded ${k.cls} mt-1">${k.teks}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 text-center">
                        <div class="bg-emerald-50 rounded-xl p-3 border border-emerald-100">
                            <span class="block text-lg font-bold text-emerald-700">${p.benar}</span>
                            <span class="text-[11px] text-gray-500">Benar</span>
                        </div>
                        <div class="bg-rose-50 rounded-xl p-3 border border-rose-100">
                            <span class="block text-lg font-bold text-rose-700">${p.salah}</span>
                            <span class="text-[11px] text-gray-500">Salah</span>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                            <span class="block text-lg font-bold text-gray-700">${p.kosong}</span>
                            <span class="text-[11px] text-gray-500">Kosong</span>
                        </div>
                    </div>

                    ${aksi}
                    ${panelKunci(p)}

                    <div>
                        <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Rincian Jawaban</h3>
                        <div class="overflow-x-auto border border-gray-200 rounded-xl">
                            <table class="w-full text-xs">
                                <thead>
                                    <tr class="bg-gray-50 text-[10px] uppercase tracking-wider text-gray-500">
                                        <th class="p-2 text-left w-8">No</th>
                                        <th class="p-2 text-left">Pertanyaan</th>
                                        <th class="p-2 text-center w-16">Jawaban</th>
                                        <th class="p-2 text-center w-14">Kunci</th>
                                        <th class="p-2 text-center w-14">Hasil</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${st.soal.map(s => {
                                        const d = p.detail[s.no] || {};
                                        const benar = d.benar === true;
                                        const kosong = !d.jawaban;
                                        return `
                                            <tr class="border-t border-gray-100 align-top ${benar ? '' : 'bg-rose-50/30'}">
                                                <td class="p-2 font-bold">${s.no}</td>
                                                <td class="p-2 text-gray-700">${esc(s.pertanyaan)}</td>
                                                <td class="p-2 text-center font-bold uppercase">${kosong ? '<span class="text-gray-400">-</span>' : esc(d.jawaban)}</td>
                                                <td class="p-2 text-center font-bold uppercase text-gray-500">${esc(s.kunci)}</td>
                                                <td class="p-2 text-center">
                                                    ${kosong
                                                        ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-600">Kosong</span>'
                                                        : benar
                                                            ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">Benar</span>'
                                                            : '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-100 text-rose-700">Salah</span>'}
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function setCari(v) {
            st.cari = v;
            document.getElementById('daftar-kelas').innerHTML = renderDaftarKelas();
        }

        function pilih(id) {
            st.aktif = id;
            st.pesanAksi = '';
            render();
        }

        async function buatKode(id) {
            const { data, error } = await db.rpc('buat_kode_buka', { p_sesi: id });
            if (error) {
                st.pesanAksi = 'Gagal membuat kode: ' + error.message;
            } else {
                st.pesanAksi = `Kode buka: ${data}. Berlaku sampai 5 kali percobaan salah.`;
            }
            await muat();
            if (!error) st.pesanAksi = `Kode buka: ${data}. Berlaku sampai 5 kali percobaan salah.`;
            render();
        }

        async function bukaPaksa(id) {
            if (!confirm('Buka tes tanpa kode?')) return;
            const { error } = await db.rpc('buka_paksa', { p_sesi: id });
            st.pesanAksi = error ? 'Gagal: ' + error.message : 'Tes dibuka. Minta kelas memuat ulang halaman.';
            await muat();
            render();
        }

        async function izinkanUlang(id) {
            if (!confirm('Izinkan kelas mengerjakan ulang? Jawaban lama akan dihapus.')) return;
            const { error } = await db.rpc('izinkan_ulang', { p_sesi: id });
            st.pesanAksi = error ? 'Gagal: ' + error.message : 'Kelas dapat mengerjakan ulang.';
            await muat();
            render();
        }

        function eksporCSV() {
            const list = daftarPeringkat();
            if (!list.length) { alert('Belum ada data untuk diekspor.'); return; }

            const kepala = [
                'Peringkat', 'Kelas', 'Nilai', 'Kategori', 'Benar', 'Salah', 'Kosong',
                'Mulai', 'Waktu Kumpul', 'Durasi', 'Pelanggaran',
                ...NOMOR.map(n => `Jawaban ${n}`),
                ...NOMOR.map(n => `Kunci ${n}`)
            ];

            const baris = list.map((p, i) => {
                const k = kategori(p.skor);
                return [
                    i + 1,
                    p.kelas,
                    p.skor,
                    k.teks,
                    p.benar,
                    p.salah,
                    p.kosong,
                    formatWaktu(p.mulai),
                    formatWaktu(p.kumpul),
                    p.durasi,
                    p.pelanggaran.length,
                    ...NOMOR.map(n => (p.detail[n] && p.detail[n].jawaban) || ''),
                    ...NOMOR.map(n => (p.detail[n] && p.detail[n].kunci) || '')
                ];
            });

            const csv = [kepala, ...baris]
                .map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
                .join('\r\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cerdas-cermat-kebangsaan-2026-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function init() {
            const { data } = await db.auth.getSession();
            if (data.session) await muat();
            else render();
        }

        init();
    </script>
</body>
</html>
