        function esc(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function acak(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function siapkanAcak() {
            state.urutanSoal = acak(SOAL.map(s => s.no));
            state.urutanOpsi = {};
            SOAL.forEach(s => {
                state.urutanOpsi[s.no] = acak(HURUF.slice());
            });
        }

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!saved) return;
                state.kelas = saved.kelas || '';
                state.jawaban = saved.jawaban || {};
                state.urutanSoal = saved.urutanSoal || [];
                state.urutanOpsi = saved.urutanOpsi || {};
                state.pelanggaran = saved.pelanggaran || [];
                state.sesi = saved.sesi || null;
                state.kunciLokal = !!saved.kunciLokal;
                state.jenisKunci = saved.jenisKunci || '';
                state.bukaNoSaatKunci = saved.bukaNoSaatKunci || 0;
                state.idx = typeof saved.idx === 'number' ? saved.idx : 0;
                state.sisa = typeof saved.sisa === 'number' ? saved.sisa : DURASI;
                state.submitted = !!saved.submitted;
                state.statusKirim = saved.statusKirim === 'mengirim' ? 'gagal' : (saved.statusKirim || null);

                if (!state.urutanSoal.length) siapkanAcak();

                if (state.submitted) {
                    state.screen = 'done';
                } else if (['quiz', 'kelas', 'terkunci'].includes(saved.screen)) {
                    state.screen = saved.screen;
                }
            } catch (e) {
                console.error('Gagal membaca memori lokal', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    kelas: state.kelas,
                    jawaban: state.jawaban,
                    urutanSoal: state.urutanSoal,
                    urutanOpsi: state.urutanOpsi,
                    pelanggaran: state.pelanggaran,
                    sesi: state.sesi,
                    kunciLokal: state.kunciLokal,
                    jenisKunci: state.jenisKunci,
                    bukaNoSaatKunci: state.bukaNoSaatKunci,
                    idx: state.idx,
                    sisa: state.sisa,
                    submitted: state.submitted,
                    statusKirim: state.statusKirim,
                    screen: state.screen
                }));
            } catch (e) {
                console.error('Gagal menyimpan memori lokal', e);
            }
        }

        function hitungSisa(s) {
            const akhir = s.status === 'terkunci' && s.terkunci_sejak ? new Date(s.terkunci_sejak).getTime() : Date.now();
            const berjalan = (akhir - new Date(s.mulai).getTime()) / 1000 - (s.jeda_detik || 0);
            return Math.max(0, Math.floor(DURASI - berjalan));
        }

        function startTimer() {
            clearInterval(state.timer);
            state.timer = setInterval(() => {
                if (state.screen !== 'quiz') return;
                state.sisa--;
                if (state.sisa <= 0) {
                    state.sisa = 0;
                    updateTimerUI();
                    submitQuiz(true);
                    return;
                }
                saveState();
                updateTimerUI();
            }, 1000);
        }

        function formatWaktu(detik) {
            const m = Math.floor(detik / 60).toString().padStart(2, '0');
            const d = (detik % 60).toString().padStart(2, '0');
            return `${m}:${d}`;
        }

        function updateTimerUI() {
            const el = document.getElementById('quiz-timer');
            if (!el) return;
            el.textContent = formatWaktu(state.sisa);
            const wrap = el.closest('.timer-wrap');
            if (wrap) {
                wrap.classList.toggle('bg-red-600', state.sisa <= 300);
                wrap.classList.toggle('bg-white/15', state.sisa > 300);
            }
        }

        function render() {
            const c = document.getElementById('app-container');
            if (!c) return;

            if (state.screen === 'welcome') c.innerHTML = renderWelcome();
            else if (state.screen === 'kelas') c.innerHTML = renderPilihKelas();
            else if (state.screen === 'quiz') { c.innerHTML = renderQuiz(); updateTimerUI(); }
            else if (state.screen === 'terkunci') c.innerHTML = renderTerkunci();
            else if (state.screen === 'selesai') c.innerHTML = renderSelesai();
            else c.innerHTML = renderDone();

            saveState();
        }

                            <li>Tes berjalan dalam mode layar penuh. Keluar dari layar penuh akan mengunci tes.</li>
                            <li>Berpindah tab, keluar aplikasi, menyalin, atau menempel juga mengunci tes.</li>
                            <li>Tes yang terkunci hanya dapat dibuka kembali dengan kode dari pengawas.</li>
                            <li>Jawab seluruh 25 soal sebelum mengumpulkan.</li>
                        </ol>
                    </div>

                    ${state.kelas ? `
                        <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 text-xs text-blue-800 flex items-start space-x-2">
                            <i class="fa-solid fa-clock-rotate-left mt-0.5"></i>

                </div>

                <div class="bg-white border-t border-gray-200 p-4 sticky bottom-0 z-20">
                    <div class="max-w-5xl mx-auto">
                        <button onclick="mulaiAlur()" class="w-full py-3.5 bg-brand-merah hover:bg-brand-merahHover text-white font-bold rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-flag-checkered"></i>
                            <span>${state.kelas ? 'Lanjutkan' : 'Mulai'}</span>
                        </button>
                    </div>
                </div>

        }

        function renderPilihKelas() {
            const opsi = KELAS.map(g => `
                <optgroup label="Kelas ${g.tingkat}">
                    ${g.nama.map(n => {
                        const v = `${g.tingkat} ${n}`;
                        return `<option value="${esc(v)}" ${state.kelas === v ? 'selected' : ''}>${v}</option>`;
                    }).join('')}
                </optgroup>
            `).join('');

            return `
                <div class="bg-brand-merah text-white pt-10 pb-20 px-4 sm:px-6 relative overflow-hidden pattern-merah">
                    <div class="max-w-lg mx-auto relative z-10">
                        <h1 class="text-2xl font-extrabold mb-2">Pilih Kelas</h1>
                        <p class="text-rose-100 text-sm">Pastikan kelas sudah benar. Satu kelas hanya bisa mengerjakan satu kali.</p>
                    </div>
                </div>

                <div class="max-w-lg mx-auto px-4 sm:px-6 -mt-12 mb-10 relative z-20 w-full">
                    <div class="bg-white rounded-2xl p-6 shadow-xl border border-gray-100 space-y-4">
                        <label for="pilih-kelas" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Kelas</label>
                        <select id="pilih-kelas" class="w-full p-4 border-2 border-gray-200 focus:border-brand-merah rounded-xl text-sm bg-white outline-none transition">
                            <option value="">-- Pilih Kelas --</option>
                            ${opsi}
                        </select>
                        <p class="text-xs text-gray-500 leading-relaxed">
                            Dengan menekan tombol di bawah, tes akan dibuka dalam mode layar penuh.
                        </p>
                    </div>
                </div>

                <div class="bg-white border-t border-gray-200 p-4 sticky bottom-0 z-20">
                    <div class="max-w-lg mx-auto flex gap-3">
                        <button onclick="state.screen='welcome'; render();" class="px-5 py-3 rounded-xl border border-gray-300 text-xs font-semibold text-gray-700 hover:bg-gray-50 transition">
                            Kembali
                        </button>
                        <button onclick="masukTes()" class="flex-1 py-3 bg-brand-merah hover:bg-brand-merahHover text-white font-bold rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-expand"></i>
                            <span>Masuk Tes</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            const no = state.urutanSoal[state.idx];
            const s = SOAL.find(x => x.no === no);
            const urut = state.urutanOpsi[no] || HURUF;
            const dipilih = state.jawaban[no] || '';

            return `
                <div class="bg-brand-merah text-white py-3 px-4 sm:px-6 shadow-md">
                    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
                        <div class="flex items-center space-x-3 min-w-0">
                            <button onclick="kembaliKeBeranda()" class="bg-white/10 hover:bg-white/20 p-2 rounded-full text-xs shrink-0 transition" title="Ke beranda">
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>
                            <div class="min-w-0">
                                <p class="text-xs sm:text-sm font-semibold truncate">Cerdas Cermat Kebangsaan 2026</p>
                                <p class="text-[11px] text-rose-200 truncate">${esc(state.kelas)}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
                            <span id="pelanggaran-pill" class="${state.pelanggaran.length ? '' : 'hidden'} bg-amber-400 text-brand-merah px-3 py-1.5 rounded-full text-xs font-bold">${state.pelanggaran.length}</span>
                            <div class="timer-wrap flex items-center space-x-2 bg-white/15 px-3 py-1.5 rounded-full text-xs font-bold">
                                <i class="fa-regular fa-clock"></i>
                                <span id="quiz-timer">45:00</span>
                            </div>
                            <button onclick="toggleModal(true)" class="bg-white text-brand-merah hover:bg-rose-50 px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow-sm">
                                Kumpulkan
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white border-b border-gray-200 py-3 px-4 sm:px-6 sticky top-0 z-20 shadow-sm">
                    <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
                        <span class="text-sm font-bold text-gray-900 shrink-0">Soal ${state.idx + 1}<span class="text-gray-400 font-medium">/25</span></span>
                        <div id="nav-pills" class="flex items-center space-x-1.5 overflow-x-auto custom-scrollbar px-1 py-1">
                            ${renderPills()}
                        </div>
                    </div>
                </div>

                <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow">
                    <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-gray-200">
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold px-2.5 py-1 bg-rose-50 text-brand-merah rounded-lg uppercase tracking-wider">Pilihan Ganda</span>
                            <span class="text-xs font-semibold text-gray-400">4 poin</span>
                        </div>

                        <div class="text-sm sm:text-base text-gray-900 font-medium leading-relaxed whitespace-pre-line mb-6">
                            ${esc(s.t)}
                        </div>

                        <div class="space-y-3">
                            ${urut.map((asli, i) => {
                                const idxAsli = HURUF.indexOf(asli);
                                const teks = s.o[idxAsli];
                                const aktif = dipilih === asli;
                                return `
                                    <button onclick="pilihJawaban(${no}, '${asli}')" class="w-full text-left p-4 rounded-xl border-2 transition flex items-start space-x-3 ${aktif ? 'border-brand-merah bg-rose-50/60 shadow-sm' : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'}">
                                        <div class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs shrink-0 mt-0.5 ${aktif ? 'bg-brand-merah text-white' : 'bg-gray-100 text-gray-600'}">
                                            ${LABEL[i]}
                                        </div>
                                        <div class="text-sm text-gray-800 leading-snug pt-0.5">${esc(teks)}</div>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>

                <div class="bg-white border-t border-gray-200 p-4 sticky bottom-0 z-20">
                    <div class="max-w-3xl mx-auto flex items-center justify-between">
                        <button onclick="prevQuestion()" ${state.idx === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-5 py-2.5 rounded-xl border border-gray-300 text-xs font-semibold text-gray-400"' : 'class="px-5 py-2.5 rounded-xl border border-gray-300 hover:bg-gray-50 text-xs font-semibold text-gray-700 transition flex items-center space-x-2"'}>
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                            <span>Sebelumnya</span>
                        </button>

                        <button onclick="nextQuestion()" class="px-6 py-2.5 bg-brand-merah hover:bg-brand-merahHover text-white font-bold rounded-xl text-xs transition shadow-md flex items-center space-x-2">
                            <span>${state.idx === 24 ? 'Ringkasan' : 'Berikutnya'}</span>
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderPills() {
            return state.urutanSoal.map((no, i) => {
                const aktif = i === state.idx;
                const dijawab = !!state.jawaban[no];
                let style = 'bg-gray-100 text-gray-600 border border-gray-200';
                if (aktif) style = 'bg-brand-merah text-white font-bold shadow-md scale-105';
                else if (dijawab) style = 'bg-emerald-500 text-white font-semibold';
                return `
                    <button onclick="goTo(${i})" class="w-7 h-7 shrink-0 rounded-full text-[11px] transition flex items-center justify-center ${style}">
                        ${i + 1}
                    </button>
                `;
            }).join('');
        }

        function renderTerkunci() {
            return `
                <div class="bg-brand-merah text-white pt-10 pb-16 px-4 sm:px-6 pattern-merah">
                    <div class="max-w-md mx-auto text-center">
                        <div class="w-16 h-16 mx-auto rounded-full bg-white/15 flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <h1 class="text-xl sm:text-2xl font-extrabold mt-4">Tes Dikunci</h1>
                        <p class="text-rose-100 text-sm mt-2">${esc(state.jenisKunci || 'Aktivitas di luar halaman tes')}</p>
                    </div>
                </div>

                <div class="max-w-md mx-auto px-4 -mt-8 mb-10 w-full">
                    <div class="bg-white rounded-2xl p-6 shadow-xl border border-gray-100 space-y-5">
                        <p class="text-sm text-gray-700 leading-relaxed">
                            Jawaban tersimpan. Tes hanya bisa dilanjutkan setelah pengawas memberikan kode.
                        </p>
                        <form onsubmit="event.preventDefault(); bukaDenganKode(this.kode.value.trim());" class="space-y-3">
                            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Kode dari pengawas</label>
                            <input name="kode" type="text" autocomplete="off" required maxlength="10" class="w-full p-4 border-2 border-gray-200 focus:border-brand-merah rounded-xl text-center text-lg font-bold tracking-widest uppercase outline-none transition">
                            <button type="submit" class="w-full py-3 bg-brand-merah hover:bg-brand-merahHover text-white font-bold rounded-xl transition">
                                Buka Kunci
                            </button>
                        </form>
                        ${state.pesanKunci ? `<p class="text-xs text-red-600 text-center">${esc(state.pesanKunci)}</p>` : ''}
                    </div>
                </div>
            `;
        }

        function renderSelesai() {
            return `
                <div class="bg-brand-merah text-white py-10 px-4 sm:px-6 pattern-merah">
                    <div class="max-w-lg mx-auto text-center">
                        <h1 class="text-xl sm:text-2xl font-bold">Kelas Ini Sudah Selesai</h1>
                        <p class="text-xs text-rose-200 mt-1">Cerdas Cermat Kebangsaan 2026</p>
                    </div>
                </div>
                <div class="max-w-md mx-auto px-4 -mt-10 mb-10 w-full">
                    <div class="bg-white rounded-2xl p-8 shadow-xl border border-gray-100 text-center space-y-4">
                        <div class="w-16 h-16 mx-auto rounded-full bg-amber-50 text-brand-gold flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-flag-checkered"></i>
                        </div>
                        <p class="text-sm text-gray-700 leading-relaxed">
                            <strong>${esc(state.kelas)}</strong> sudah mengumpulkan jawaban. Jika perlu mengerjakan ulang, hubungi pengawas.
                        </p>
                    </div>
                </div>
            `;
        }

        function renderStatusKirim() {
            if (state.statusKirim === 'berhasil') {
                return `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-emerald-800 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Jawaban sudah tersimpan di server.</span>
                    </div>
                `;
            }
            if (state.statusKirim === 'mengirim') {
                return `
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <span>Mengirim jawaban...</span>
                    </div>
                `;
            }
            return `
                <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-xs text-red-800 space-y-3">
                    <span class="block">Belum terkirim. Periksa koneksi internet, lalu kirim ulang. Jawaban tetap tersimpan.</span>
                    <button onclick="kirimHasil()" class="px-4 py-2 bg-brand-merah text-white font-bold rounded-lg transition">
                        Kirim Ulang
                    </button>
                </div>
            `;
        }

        function renderDone() {
            const terjawab = Object.keys(state.jawaban).filter(k => state.jawaban[k]).length;
            return `
                <div class="bg-brand-merah text-white py-10 px-4 sm:px-6 pattern-merah">
                    <div class="max-w-lg mx-auto text-center">
                        <h1 class="text-xl sm:text-2xl font-bold">Jawaban Terkirim</h1>
                        <p class="text-xs text-rose-200 mt-1">Cerdas Cermat Kebangsaan 2026</p>
                    </div>
                </div>

                <div class="max-w-md mx-auto px-4 -mt-10 mb-10 w-full">
                    <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-xl border border-gray-100 text-center space-y-5">
                        <div class="w-16 h-16 mx-auto rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-gray-900">Terima kasih!</h2>
                            <p class="text-xs text-gray-500 mt-1">Hasil akan diumumkan oleh pengawas.</p>
                        </div>

                        ${renderStatusKirim()}

                        <div class="bg-gray-50 rounded-xl p-4 text-left space-y-1 border border-gray-100">
                            <span class="block text-sm font-bold text-gray-900">${esc(state.kelas)}</span>
                            <span class="block text-xs text-gray-500">${terjawab} dari 25 soal terjawab</span>
                        </div>

                        <p class="text-[11px] text-gray-400">Jangan tutup halaman sebelum pengawas memastikan jawaban tersimpan.</p>
                    </div>
                </div>
            `;
        }

        function mulaiAlur() {
            if (state.sesi && state.kelas) {
                lanjutkanSesi();
            } else {
                state.screen = 'kelas';
                render();
            }
        }

        async function masukTes() {
            const pilih = document.getElementById('pilih-kelas');
            const kelas = pilih.value;
            if (!kelas) {
                showToast('Pilih kelas terlebih dahulu.');
                return;
            }
            state.kelas = kelas;

            await masukFullscreen();

            try {
                const { data, error } = await db.rpc('mulai_sesi', { p_kelas: kelas });
                if (error) throw error;
                terapkanSesi(data);
            } catch (e) {
                console.error(e);
                showToast('Tidak bisa terhubung ke server. Periksa koneksi lalu coba lagi.');
                return;
            }

            if (!state.urutanSoal.length) siapkanAcak();
            await aturStatusAwal(false);
        }

        async function lanjutkanSesi() {
            try {
                const { data, error } = await db.rpc('mulai_sesi', { p_kelas: state.kelas });
                if (error) throw error;
                terapkanSesi(data);
            } catch (e) {
                console.error(e);
                showToast('Tidak bisa terhubung ke server.');
                return;
            }
            await aturStatusAwal(false);
        }

        function terapkanSesi(data) {
            if (state.kunciLokal && data.buka_no > state.bukaNoSaatKunci) {
                state.kunciLokal = false;
            }
            state.sesi = data;
            state.kelas = data.kelas;
            saveState();
        }

        async function aturStatusAwal(mintaFullscreen) {
            const s = state.sesi;

            if (s.status === 'selesai') {
                keluarFullscreen();
                state.screen = 'selesai';
                render();
                return;
            }

            if (s.status === 'terkunci') {
                keluarFullscreen();
                state.screen = 'terkunci';
                render();
                return;
            }

            if (state.kunciLokal) {
                keluarFullscreen();
                state.screen = 'terkunci';
                render();
                await catatKeServer(state.jenisKunci || 'Pelanggaran');
                return;
            }

            state.sisa = hitungSisa(s);
            state.screen = 'quiz';
            render();

            if (mintaFullscreen) await masukFullscreen();
            else if (!document.fullscreenElement) await masukFullscreen();

            if (state.sisa <= 0) {
                submitQuiz(true);
                return;
            }
            startTimer();
        }

        async function masukFullscreen() {
            try {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                state.fsAktif = !!document.fullscreenElement;
            } catch (e) {
                console.warn('Layar penuh ditolak browser', e);
                state.fsAktif = false;
            }
            saveState();
        }

        function kembaliKeBeranda() {
            state.screen = 'welcome';
            render();
        }

        function pilihJawaban(no, huruf) {
            if (state.submitted) return;
            state.jawaban[no] = huruf;
            render();
        }

        function goTo(i) {
            state.idx = i;
            render();
        }

        function prevQuestion() {
            if (state.idx > 0) { state.idx--; render(); }
        }

        function nextQuestion() {
            if (state.idx < 24) { state.idx++; render(); }
            else toggleModal(true);
        }

        function toggleModal(show) {
            const m = document.getElementById('overview-modal');
            if (!m) return;
            if (show) { updateModal(); m.classList.remove('hidden'); }
            else m.classList.add('hidden');
        }

        function updateModal() {
            const terjawab = Object.keys(state.jawaban).filter(k => state.jawaban[k]).length;
            const kosong = 25 - terjawab;
            const persen = Math.round((terjawab / 25) * 100);

            document.getElementById('modal-answered-count').innerText = terjawab;
            document.getElementById('modal-skipped-count').innerText = kosong;
            document.getElementById('modal-progress-bar').style.width = `${persen}%`;

            const warn = document.getElementById('modal-warning-banner');
            const btn = document.getElementById('modal-submit-btn');

            if (kosong > 0) {
                warn.classList.remove('hidden');
                btn.disabled = true;
                btn.className = 'px-6 py-2.5 bg-gray-200 text-gray-400 text-xs font-bold rounded-xl cursor-not-allowed border border-gray-300';
                btn.innerHTML = `<i class="fa-solid fa-lock text-xs"></i> Belum lengkap (${kosong})`;
            } else {
                warn.classList.add('hidden');
                btn.disabled = false;
                btn.className = 'px-6 py-2.5 bg-brand-merah hover:bg-brand-merahHover text-white text-xs font-bold rounded-xl shadow-md transition';
                btn.innerHTML = 'Ya, Kumpulkan';
            }

            document.getElementById('modal-grid').innerHTML = state.urutanSoal.map((no, i) => {
                const aktif = i === state.idx;
                const dijawab = !!state.jawaban[no];
                let style = 'bg-gray-50 text-gray-600 border-gray-200';
                if (aktif) style = 'bg-brand-merah text-white border-brand-merah font-bold';
                else if (dijawab) style = 'bg-emerald-500 text-white border-emerald-500 font-bold';
                return `<button onclick="toggleModal(false); goTo(${i});" class="py-2 rounded-xl text-xs font-bold border transition ${style}">${i + 1}</button>`;
            }).join('');
        }

        async function kirimHasil() {
            state.statusKirim = 'mengirim';
            render();

            try {
                const { error } = await db.rpc('kirim_hasil', {
                    p_kelas: state.kelas,
                    p_durasi: DURASI - state.sisa,
                    p_jawaban: state.jawaban,
                    p_sesi: state.sesi ? state.sesi.id : null
                });
                if (error) throw error;
                state.statusKirim = 'berhasil';
            } catch (e) {
                console.error('Gagal mengirim hasil', e);
                state.statusKirim = 'gagal';
            }
            render();
        }

        function submitQuiz(paksa) {
            const kosong = 25 - Object.keys(state.jawaban).filter(k => state.jawaban[k]).length;
            if (!paksa && kosong > 0) {
                showToast(`Masih ada ${kosong} soal yang belum dijawab.`);
                return;
            }
            toggleModal(false);
            state.submitted = true;
            state.screen = 'done';
            clearInterval(state.timer);
            keluarFullscreen();
            saveState();
            kirimHasil();
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl z-[70] max-w-sm text-center';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function showPeringatan(msg) {
            const t = document.createElement('div');
            t.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-brand-merah text-white text-xs sm:text-sm px-5 py-3 rounded-xl shadow-xl z-[70] flex items-center space-x-2 max-w-sm';
            t.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>${esc(msg)}</span>`;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        async function catatKeServer(jenis) {
            if (!state.sesi) return false;
            const no = state.urutanSoal[state.idx] || 0;
            const { data, error } = await db.rpc('catat_pelanggaran', {
                p_sesi: state.sesi.id,
                p_jenis: jenis,
                p_soal: no
            });
            if (error) {
                console.error(error);
                return false;
            }
            state.sesi.status = data.status;
            saveState();
            return true;
        }

        let terakhirCatat = 0;

        async function catatPelanggaran(jenis) {
            if (state.screen !== 'quiz' || state.submitted) return;
            const now = Date.now();
            if (now - terakhirCatat < 1500) return;
            terakhirCatat = now;

            const no = state.urutanSoal[state.idx] || 0;
            state.pelanggaran.push({ waktu: new Date().toISOString(), jenis: jenis, soal: no });
            state.kunciLokal = true;
            state.jenisKunci = jenis;
            state.bukaNoSaatKunci = state.sesi ? (state.sesi.buka_no || 0) : 0;
            state.screen = 'terkunci';
            state.pesanKunci = '';
            clearInterval(state.timer);
            saveState();
            render();
            showPeringatan(`${jenis}. Tes dikunci.`);

            const ok = await catatKeServer(jenis);
            if (!ok) {
                state.pesanKunci = 'Koneksi bermasalah. Kunci tetap berlaku dan akan dicatat saat halaman dibuka kembali.';
                render();
            }
        }

        async function bukaDenganKode(kode) {
            state.pesanKunci = 'Memeriksa kode...';
            render();

            try {
                const { data, error } = await db.rpc('buka_kunci', {
                    p_sesi: state.sesi.id,
                    p_kode: kode
                });
                if (error) throw error;

                if (data !== 'ok') {
                    const pesan = {
                        salah: 'Kode salah. Periksa kembali.',
                        habis: 'Kode tidak berlaku lagi. Minta kode baru kepada pengawas.',
                        tidak_terkunci: 'Tes tidak sedang dikunci. Muat ulang halaman.'
                    };
                    state.pesanKunci = pesan[data] || 'Kode tidak berlaku.';
                    render();
                    return;
                }

                state.kunciLokal = false;
                state.pesanKunci = '';
                await lanjutkanSesi();
            } catch (e) {
                console.error(e);
                state.pesanKunci = 'Gagal terhubung ke server. Coba lagi.';
                render();
            }
        }

        function pasangPengawasan() {
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) catatPelanggaran('Pindah ke tab atau aplikasi lain');
            });
            window.addEventListener('blur', () => catatPelanggaran('Keluar dari halaman tes'));
            document.addEventListener('copy', e => { e.preventDefault(); catatPelanggaran('Menyalin teks'); });
            document.addEventListener('cut', e => { e.preventDefault(); catatPelanggaran('Memotong teks'); });
            document.addEventListener('paste', e => { e.preventDefault(); catatPelanggaran('Menempel teks'); });
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'PrintScreen') catatPelanggaran('Menekan tombol PrintScreen');
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') e.preventDefault();
            });
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && state.fsAktif && state.screen === 'quiz' && !state.submitted) {
                    catatPelanggaran('Keluar dari mode layar penuh');
                }
            });
        }

        window.onload = async function () {
            loadState();
            pasangPengawasan();
            render();

            const perluSinkron = state.sesi && state.kelas && ['quiz', 'terkunci'].includes(state.screen);
            if (perluSinkron) {
                try {
                    const { data, error } = await db.rpc('mulai_sesi', { p_kelas: state.kelas });
                    if (error) throw error;
                    terapkanSesi(data);
                    await aturStatusAwal(false);
                } catch (e) {
                    console.error(e);
                    if (state.screen === 'quiz') startTimer();
                }
            }
        };
    </script>
</body>
</html>
